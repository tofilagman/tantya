# Builds the desktop apps. Windows can't be built on a Mac, so this is the only place
# the Windows app is built. Every push keeps the zips as workflow artifacts; pushing a
# tag like v0.2.0 also publishes them on a GitHub Release.
name: Desktop builds

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach zips to releases on tag pushes

env:
  FLUTTER_VERSION: '3.47.6' # keep in step with the Flutter used locally

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath tantya-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tantya-windows-x64
          path: tantya-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tantya-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip
        # ditto keeps the .app bundle's symlinks and metadata intact.
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Tantya.app tantya-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tantya-macos
          path: tantya-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tantya-macos.zip
